name: skip-the-trip-staging

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skip_the_trip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skip_the_trip"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./server
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skip_the_trip
    command: ["npm", "run", "db:migrate:prod"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skip_the_trip
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPORT_WINDOW_MINUTES: ${REPORT_WINDOW_MINUTES:-30}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      VOTE_COOLDOWN_SECONDS: ${VOTE_COOLDOWN_SECONDS:-300}
      SENTRY_DSN: ${GLITCHTIP_SERVER_DSN:-}
      SENTRY_ENVIRONMENT: staging
      SENTRY_RELEASE: ${APP_RELEASE:-local}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  retention:
    profiles: ["operations"]
    build:
      context: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skip_the_trip
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      VOTE_COOLDOWN_SECONDS: ${VOTE_COOLDOWN_SECONDS:-300}
    command: ["npm", "run", "db:retention:prod"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  integration:
    profiles: ["test"]
    build:
      context: ./server
      target: builder
    environment:
      TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/skip_the_trip
    command: ["npm", "run", "test:integration"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.1.6
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: staging
        VITE_RELEASE: ${APP_RELEASE:-local}
        VITE_SENTRY_DSN: ${GLITCHTIP_WEB_DSN:-}
        VITE_GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
