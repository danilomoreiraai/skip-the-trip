name: skip-the-trip

services:
  migrate:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the EasyPanel PostgreSQL internal URL}
    command: ["npm", "run", "db:migrate:prod"]
    networks:
      - default
      - easypanel
    restart: "no"

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?Set the EasyPanel PostgreSQL internal URL}
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPORT_WINDOW_MINUTES: ${REPORT_WINDOW_MINUTES:-30}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      SENTRY_DSN: ${GLITCHTIP_SERVER_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${APP_RELEASE:?Set APP_RELEASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: production
        VITE_RELEASE: ${APP_RELEASE:?Set APP_RELEASE}
        VITE_SENTRY_DSN: ${GLITCHTIP_WEB_DSN:-}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  easypanel:
    external: true
