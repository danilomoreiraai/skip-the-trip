name: skip-the-trip

services:
  migrate:
    build:
      context: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the EasyPanel PostgreSQL internal URL}
    command: ["npm", "run", "db:migrate:prod"]
    networks:
      - default
      - easypanel
    restart: "no"

  server:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      DATABASE_URL: ${DATABASE_URL:?Set the EasyPanel PostgreSQL internal URL}
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REPORT_WINDOW_MINUTES: ${REPORT_WINDOW_MINUTES:-30}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      VOTE_COOLDOWN_SECONDS: ${VOTE_COOLDOWN_SECONDS:-300}
      LOCATION_MAX_ACCURACY_METERS: ${LOCATION_MAX_ACCURACY_METERS:-100}
      LOCATION_LATITUDE: ${LOCATION_LATITUDE:-51.907327}
      LOCATION_LONGITUDE: ${LOCATION_LONGITUDE:--8.513503}
      LOCATION_RADIUS_METERS: ${LOCATION_RADIUS_METERS:-500}
      SENTRY_DSN: ${GLITCHTIP_SERVER_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${APP_RELEASE:?Set APP_RELEASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3333/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backup-monitor:
    build:
      context: ./server
    environment:
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?Set R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-skip-the-trip-backups}
      R2_PREFIX: ${R2_PREFIX:-production/postgres/}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_CHECK_INTERVAL_SECONDS: ${BACKUP_CHECK_INTERVAL_SECONDS:-3600}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
    command: ["node", "dist/src/jobs/check-r2-backup.js"]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  retention-scheduler:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the EasyPanel PostgreSQL internal URL}
      REPORT_RETENTION_DAYS: ${REPORT_RETENTION_DAYS:-30}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-24}
      RETENTION_FAILURE_THRESHOLD: ${RETENTION_FAILURE_THRESHOLD:-3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?Set TELEGRAM_CHAT_ID}
    command: ["npm", "run", "db:retention:scheduler:prod"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - easypanel
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: /api
        VITE_APP_ENV: production
        VITE_RELEASE: ${APP_RELEASE:?Set APP_RELEASE}
        VITE_SENTRY_DSN: ${GLITCHTIP_WEB_DSN:-}
        VITE_GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - easypanel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  easypanel:
    external: true
