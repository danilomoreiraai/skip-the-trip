name: Quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: skip_the_trip_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skip_the_trip_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skip_the_trip_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - uses: codecov/codecov-action@v5
        with:
          directory: server/coverage
          fail_ci_if_error: true
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  staging-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      POSTGRES_PASSWORD: ci-staging-password-not-for-production
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password-not-for-production
      PUBLIC_ORIGIN: http://localhost:8080
      WEB_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose -f compose.staging.yml --profile monitoring up --build -d --wait
      - run: docker compose -f compose.staging.yml --profile test run --build --rm integration
      - run: node scripts/smoke-staging.mjs
      - run: node scripts/smoke-monitoring.mjs
      - run: docker compose -f compose.staging.yml --profile operations run --build --rm retention
      - if: always()
        run: docker compose -f compose.staging.yml logs --no-color
      - if: always()
        run: docker compose -f compose.staging.yml down -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high
      - if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v5
        with:
          directory: web/coverage
          fail_ci_if_error: true
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:mutation
